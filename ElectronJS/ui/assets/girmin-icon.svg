<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ibexBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#eaf6fb"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#3a7bd5" stroke-width="1.5" opacity="0.7"/>
  <!-- Artistic Ibex -->
  <g>
    <!-- Horns -->
    <path d="M20 24 Q10 10 32 8 Q54 10 44 24" stroke="url(#ibexBlue)" stroke-width="3" fill="none"/>
    <path d="M22 26 Q14 16 32 14 Q50 16 42 26" stroke="url(#ibexBlue)" stroke-width="2" fill="none"/>
    <!-- Head -->
    <ellipse cx="32" cy="28" rx="8" ry="7" fill="url(#ibexBlue)" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="29" cy="28" r="1.2" fill="#1e3a5f"/>
    <circle cx="35" cy="28" r="1.2" fill="#1e3a5f"/>
    <!-- Body -->
    <ellipse cx="32" cy="42" rx="12" ry="8" fill="url(#ibexBlue)" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- Legs -->
    <rect x="24" y="50" width="2.5" height="8" rx="1" fill="#1e3a5f"/>
    <rect x="37.5" y="50" width="2.5" height="8" rx="1" fill="#1e3a5f"/>
    <rect x="28" y="52" width="2" height="7" rx="1" fill="#3a7bd5"/>
    <rect x="34" y="52" width="2" height="7" rx="1" fill="#3a7bd5"/>
    <!-- Tail -->
    <path d="M44 48 Q48 52 42 54" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  </g>
</svg>