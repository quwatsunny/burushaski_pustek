    <style>

        .top-bar-left {

        .back-btn {

            border: none;

            display: flex;

            gap: 5px;

        }

        .book-title-bar {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .view-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Main Content Area */
        .main-content {
            margin-top: 50px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Book Container */
        .book-container {
            width: 100%;
            max-width: 800px;
            background: var(--paper-color);
            box-shadow: 0 0 30px var(--shadow-color), 
                        0 0 0 1px var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        /* Cover Page */
        .book-cover {
            padding: 80px 60px;
            text-align: center;
            background: none;
            border-bottom: 3px double var(--border-color);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .book-cover h1 {
            font-size: 42px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .book-cover .subtitle {
            font-size: 18px;
            color: #666;
            font-style: italic;
            margin-bottom: 40px;
        }

        .book-cover .author {
            font-size: 20px;
            color: var(--accent-color);
            margin-top: 30px;
        }

        .book-cover .publisher {
            font-size: 14px;
            color: #888;
            margin-top: 60px;
        }

        /* Book Content */
        .book-content {
            padding: 60px;

        .book-content.rtl {
            direction: rtl;
            font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
            line-height: 2.2;
        }

        /* Chapter Styling */
        .chapter {
            margin-bottom: 60px;
            page-break-before: always;
        }

        .chapter:first-child {
            page-break-before: auto;
        }

        .chapter-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }

        /* Paragraph Styling */
        .book-content p,
        .book-content div {
            margin-bottom: 1.5em;
            text-align: justify;
            text-indent: 2em;
        }

        .book-content p:first-child,
        .book-content div:first-child {
            text-indent: 0;
        }

        /* Heading Styles */
        .book-content h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--heading-color);
            margin: 40px 0 25px 0;
            text-align: center;
        }

        .book-content h2 {
            font-size: 26px;
            font-weight: 600;
            color: var(--heading-color);
            margin: 35px 0 20px 0;
        }

        .book-content h3 {
            font-size: 22px;
            font-weight: 600;
            color: var(--heading-color);
            margin: 30px 0 15px 0;
        }

        /* Footnotes */
        .footnote-ref {
            color: var(--accent-color);
            font-size: 0.8em;
            vertical-align: super;
            cursor: pointer;
        }

        .footnotes-section {
            margin-top: 60px;
            padding: 32px 0 0 0;
            border: none !important;
            background: none !important;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #444;
            font-family: 'Merriweather', 'Noto Serif', Georgia, serif;
        }
        .footnotes-section h3 {
            font-size: 1.25rem;
            margin-bottom: 18px;
            color: #222;
            font-weight: 700;
            letter-spacing: 0.01em;
            border-bottom: 1.5px solid #bbb;
            padding-bottom: 6px;
            text-align: left;
        }
        .reference-item, .footnote-item {
            margin-bottom: 10px;
            padding-left: 2em;
            text-indent: 0;
            font-size: 1rem;
            line-height: 1.7;
            color: #333;
            position: relative;
        }
        .reference-item:before, .footnote-item sup {
            color: #8b4513;
            font-weight: bold;
            position: absolute;
            left: 0;
            top: 0.1em;
        }
        .reference-item:before {
            content: attr(data-refnum) ". ";
        }
        .footnote-item sup {
            font-size: 0.85em;
        }

        /* References Section */
        .references-section {
            margin-top: 60px;
            padding: 32px 0 0 0;
            border: none !important;
            background: none !important;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            color: #444;
            font-family: 'Merriweather', 'Noto Serif', Georgia, serif;
        }
        .references-section h3 {
            font-size: 1.25rem;
            margin-bottom: 18px;
            color: #222;
            font-weight: 700;
            letter-spacing: 0.01em;
            border-bottom: 1.5px solid #bbb;
            padding-bottom: 6px;
            text-align: left;
        }
        .reference-item {
            margin-bottom: 15px;
            padding-left: 40px;
            text-indent: -40px;
            font-size: 15px;
        }

        /* Front Matter Section */
        .book-front-matter {
            padding: 40px 60px;
            border-bottom: 2px solid var(--border-color);
        }

        .book-front-matter .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--heading-color);
            margin: 30px 0 20px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .book-front-matter .section-content {
            margin-bottom: 40px;
        }

        /* Back Matter Section */
        .book-back-matter {
            padding: 40px 60px;
            border-top: 2px solid var(--border-color);
            background: none;
        }

        .book-back-matter .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--heading-color);
            margin: 30px 0 20px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .book-back-matter .section-content {
            margin-bottom: 40px;
        }

        /* Page Numbers */
        .page-number {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 30px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
        /* Print page numbers in footer */
        @media print {
            @page {
                size: A4;
                margin: 2.5cm 2.5cm 2.5cm 2.5cm;
                /* Print page number in footer */
                @bottom-center {
                    content: "Page " counter(page);
                    font-size: 12pt;
                    color: #999;
                }
            }
            .page-number {
                display: none !important;
            }
        }

        /* RTL Support */
        .rtl .chapter-title,
        .rtl h1, .rtl h2, .rtl h3 {
            font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
        }

        .rtl p, .rtl div {
            text-align: right;
            text-indent: 0;
        }

        /* Dark Mode */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --paper-color: #252525;
            --text-color: #d4d4d4;
            --heading-color: #f0f0f0;
            --border-color: #444;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        /* No Book Message */
        .no-book-message {
            text-align: center;
            padding: 100px 40px;
            color: #666;
        }

        .no-book-message h2 {
            margin-bottom: 20px;
            color: var(--heading-color);
        }

        .no-book-message a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .no-book-message a:hover {
            text-decoration: underline;
        }

        /* Print Styles */
        @media print {
            .top-bar {
                display: none;
            }

                margin-top: 0;
                padding: 0;
            }

            .book-container {
                box-shadow: none;
                max-width: none;
            }

            .book-cover {
                page-break-after: always;
            }

            .chapter {
                page-break-before: always;
            }

        /* Responsive */
        @media (max-width: 768px) {
            .book-cover {
                padding: 50px 30px;

            .book-cover h1 {
                font-size: 28px;

        /* IPA Context Menu */
        .ipa-context-menu {

            padding: 10px 16px;

            font-size: 14px;

            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .ipa-menu-item:hover {
            background: #f0f0f0;

        .ipa-menu-item .ipa-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .ipa-menu-item .ipa-label {
            flex: 1;
        }

        .ipa-menu-item .ipa-shortcut {
            font-size: 12px;

        .ipa-menu-divider {
            height: 1px;

        .ipa-menu-header {

        /* IPA inserted text styling */
        .ipa-text {
            font-family: 'Noto Sans', 'Doulos SIL', 'Charis SIL', 'Gentium Plus', sans-serif;
            color: var(--accent-color);

            border-radius: 3px;
            margin-left: 3px;
        }

        body.dark-mode .ipa-context-menu {
            background: #2a2a2a;
            border-color: #444;
        }

        body.dark-mode .ipa-menu-item {
            color: #ddd;
        }

        body.dark-mode .ipa-menu-item:hover {
            background: #3a3a3a;
        }

        body.dark-mode .ipa-text {
            background: rgba(139, 69, 19, 0.2);
        }

/* Force remove all borders and box-shadows for a clean document look */

    background: none !important;
    border: none !important;
    box-shadow: none !important;
}
</style>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="back-btn" onclick="goToEditor()">← Editor</button>
            <span class="book-title-bar" id="bookTitleBar">Book Viewer</span>
        </div>
        <div class="top-bar-right">
            <button class="view-btn" onclick="toggleDarkMode()" id="darkModeBtn">🌙 Dark</button>
            <button class="view-btn" onclick="printBook()">🖨️ Print</button>
            <button class="view-btn" onclick="exportBookToWord()">Export Word</button>
            <button class="view-btn" onclick="exportBookToPdf()">Export PDF</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="book-container" id="bookContainer">
            <!-- Book content will be loaded here -->
            <div class="no-book-message" id="noBookMessage">
                <h2>No Book Found</h2>
                <p>Create or open a book in the <a href="editor.html">Editor</a> first.</p>
            </div>
        </div>

    <script>
        // Constants
        const AUTOSAVE_KEY = 'girmin_book_autosave';
        const METADATA_KEY = 'girmin_book_metadata';
        const SETUP_KEY = 'girmin_software_setup';

        // ========================================
        // IPA MAPPING (Orthography → IPA)
        // ========================================
        // Burushaski Latin orthography to IPA mapping
        // Customize this mapping based on your orthography system
        const IPA_MAPPINGS = {
            // Vowels
            'a': 'a', 'aa': 'aː', 'á': 'á', 'à': 'à',
            'e': 'e', 'ee': 'eː', 'é': 'é', 'è': 'è',
            'i': 'i', 'ii': 'iː', 'í': 'í', 'ì': 'ì',
            'o': 'o', 'oo': 'oː', 'ó': 'ó', 'ò': 'ò',
            'u': 'u', 'uu': 'uː', 'ú': 'ú', 'ù': 'ù',
            
            // Consonants - Basic
            'b': 'b', 'p': 'p', 'd': 'd', 't': 't',
            'g': 'ɡ', 'k': 'k', 'm': 'm', 'n': 'n',
            'l': 'l', 'r': 'r', 's': 's', 'z': 'z',
            'f': 'f', 'v': 'v', 'w': 'w', 'y': 'j',
            'h': 'h', 'j': 'dʒ',
            
            // Aspirated consonants
            'ph': 'pʰ', 'th': 'tʰ', 'kh': 'kʰ', 'ch': 'tʃʰ',
            'bh': 'bʱ', 'dh': 'dʱ', 'gh': 'ɡʱ', 'jh': 'dʒʱ',
            
            // Retroflex consonants
            'ṭ': 'ʈ', 'ḍ': 'ɖ', 'ṇ': 'ɳ', 'ṣ': 'ʂ', 'ẓ': 'ʐ',
            'ṭh': 'ʈʰ', 'ḍh': 'ɖʱ',
            
            // Affricates
            'c': 'ts', 'ć': 'tʃ', 'č': 'tʃ',
            'ċ': 'ts', 'ç': 'tɕ',
            
            // Fricatives
            'ś': 'ʃ', 'š': 'ʃ', 'x': 'x', 'ġ': 'ɣ', 'ɣ': 'ɣ',
            'ḥ': 'ħ', 'ʰ': 'ʰ',
            
            // Nasals
            'ṅ': 'ŋ', 'ñ': 'ɲ', 'ŋ': 'ŋ',
            
            // Special characters
            'q': 'q', 'ʼ': 'ʔ', "'": 'ʔ',
            
            // Digraphs - more complex mappings
            'ng': 'ŋ', 'ny': 'ɲ', 'sh': 'ʃ', 'zh': 'ʒ',
            'ts': 'ts', 'dz': 'dz', 'tc': 'tɕ', 'dc': 'dʑ'
        };

        // Sort mappings by length (longest first) for proper replacement
        const sortedMappingKeys = Object.keys(IPA_MAPPINGS).sort((a, b) => b.length - a.length);

        /**
         * Convert a word to IPA based on orthography mapping
         * @param {string} word - The word to convert
         * @returns {string} IPA transcription
         */
        function convertToIPA(word) {
            if (!word) return '';
            
            let result = '';
            let i = 0;
            const lowerWord = word.toLowerCase();
            
            while (i < lowerWord.length) {
                let matched = false;
                
                // Try to match longest sequences first
                for (const key of sortedMappingKeys) {
                    if (lowerWord.substring(i, i + key.length) === key) {
                        result += IPA_MAPPINGS[key];
                        i += key.length;
                        matched = true;
                        break;
                    }
                }
                
                // If no mapping found, keep original character
                if (!matched) {
                    result += lowerWord[i];
                    i++;
                }
            }
            
            return result;
        }

        /**
         * Detect if content is primarily RTL
         */
        function detectRTL(html) {
            // Check for dir="rtl" attribute
            if (html.includes('dir="rtl"')) return true;
            
            // Check for Arabic/Urdu script characters
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const text = tempDiv.textContent || '';
            
            // Count RTL characters (Arabic, Persian, Urdu range)
            const rtlChars = (text.match(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g) || []).length;
            const ltrChars = (text.match(/[a-zA-Z]/g) || []).length;
            
            return rtlChars > ltrChars;
        }

        /**
         * Process and clean up content
         */
        function processContent(html) {
            // Create a temporary container
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // Process chapters - look for h1, h2 with chapter-like content
            const headings = tempDiv.querySelectorAll('h1, h2');

                const text = heading.textContent.toLowerCase();
                if (text.includes('chapter') || text.includes('باب')) {
                    heading.classList.add('chapter-title');
                }
            });

            return tempDiv.innerHTML;
        }

        /**
         * Get the word at the click position
         * @param {MouseEvent} event 
         * @returns {object} - { word, range, element }
         */
        function getWordAtClick(event) {
            const selection = window.getSelection();
            
            // Get the element that was clicked
            let target = event.target;
            
            // Check if we're in an RTL context - if so, skip
            if (target.closest('.rtl') || 
                target.closest('[dir="rtl"]') ||
                getComputedStyle(target).direction === 'rtl') {
                return null;
            }
            
            // Only work within book content (LTR)
            const bookContent = target.closest('.book-content');
            if (!bookContent || bookContent.classList.contains('rtl')) {
                return null;
            }
            
            // Use caretRangeFromPoint to get precise position
            let range;
            if (document.caretRangeFromPoint) {
                range = document.caretRangeFromPoint(event.clientX, event.clientY);
            } else if (document.caretPositionFromPoint) {
                const pos = document.caretPositionFromPoint(event.clientX, event.clientY);
                range = document.createRange();
                range.setStart(pos.offsetNode, pos.offset);
                range.setEnd(pos.offsetNode, pos.offset);
            }
            
            if (!range || !range.startContainer) return null;
            
            const node = range.startContainer;
            if (node.nodeType !== Node.TEXT_NODE) return null;
            
            const text = node.textContent;
            const offset = range.startOffset;
            
            // Find word boundaries
            let start = offset;
            let end = offset;
            
            // Word characters including Burushaski special characters
            const wordRegex = /[\wáéíóúàèìòùāēīōūṭḍṇṣẓćčśšġñŋʰʼ'-]/i;
            
            // Move start backwards to find word beginning
            while (start > 0 && wordRegex.test(text[start - 1])) {
                start--;
            }
            
            // Move end forward to find word ending
            while (end < text.length && wordRegex.test(text[end])) {
                end++;
            }
            
            if (start === end) return null;
            
            const word = text.substring(start, end);
            
            // Create a range for the word
            const wordRange = document.createRange();
            wordRange.setStart(node, start);
            wordRange.setEnd(node, end);
            
            return {
                word: word,
                range: wordRange,
                element: target
            };
        }

        /**

        function insertIPAForWord() {
            if (!selectedWord || !selectedWordRange) {
                hideIPAMenu();
                return;
            }
            
            const ipa = convertToIPA(selectedWord);
            
            // Create IPA span
            const ipaSpan = document.createElement('span');
            ipaSpan.className = 'ipa-text';
            ipaSpan.textContent = '[' + ipa + ']';
            ipaSpan.title = 'IPA: ' + ipa;
            
            // Insert after the word
            const range = selectedWordRange;
            range.collapse(false); // Collapse to end
            range.insertNode(ipaSpan);
            
            // Clear selection
            window.getSelection().removeAllRanges();
            hideIPAMenu();
            
            // Show notification
            showNotification(`IPA inserted: [${ipa}]`);
        }

        /**

        function insertIPAReplace() {
            if (!selectedWord || !selectedWordRange) {

            // Create IPA span with original word as tooltip

            ipaSpan.className = 'ipa-text';
            ipaSpan.textContent = ipa;
            ipaSpan.title = 'Original: ' + selectedWord;

                        showNotification('Export to Word triggered');
                        const bookContainer = document.getElementById('bookContainer');
                        if (!bookContainer || !bookContainer.innerHTML.trim()) {
                            showNotification('No book content to export.');
                            return;
                        }
            const { bookTitle, chapters } = getBookExportData();
            if (!window.docx) {
                alert('docx.js library not loaded.');
                return;
            }
            // Helper to convert HTML to docx.js Paragraphs
            function htmlToDocxParagraphs(html) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const children = [];
                function parseNode(node, parentStyles = {}) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        let style = { bold: false, italics: false, link: null };
                        if (parentStyles) style = { ...parentStyles };
                        if (node.tagName === 'B' || node.tagName === 'STRONG') style.bold = true;
                        if (node.tagName === 'I' || node.tagName === 'EM') style.italics = true;
                        if (node.tagName === 'A' && node.href) style.link = node.href;

                        if (['P','H1','H2','H3','LI'].includes(node.tagName)) {
                            let runs = [];
                            node.childNodes.forEach(child => {
                                if (child.nodeType === Node.TEXT_NODE) {
                                    let run = new window.docx.TextRun({ text: child.textContent, bold: style.bold, italics: style.italics });
                                    if (style.link) run = new window.docx.TextRun({ text: child.textContent, style: 'Hyperlink' });
                                    runs.push(run);
                                } else if (child.nodeType === Node.ELEMENT_NODE) {
                                    runs = runs.concat(parseNode(child, style));
                                }
                            });
                            let paraProps = {};
                            if (node.tagName === 'H1') paraProps.heading = window.docx.HeadingLevel.HEADING_1;
                            if (node.tagName === 'H2') paraProps.heading = window.docx.HeadingLevel.HEADING_2;
                            if (node.tagName === 'H3') paraProps.heading = window.docx.HeadingLevel.HEADING_3;
                            if (node.tagName === 'LI' && node.parentElement && node.parentElement.tagName === 'UL') paraProps.bullet = { level: 0 };
                            if (node.tagName === 'LI' && node.parentElement && node.parentElement.tagName === 'OL') paraProps.numbering = { reference: 'numbered-list', level: 0 };
                            children.push(new window.docx.Paragraph({ children: runs, ...paraProps }));
                        } else if (node.tagName === 'UL' || node.tagName === 'OL') {
                            node.childNodes.forEach(child => parseNode(child, style));
                        } else {
                            node.childNodes.forEach(child => parseNode(child, style));
                        }
                    } else if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
                        children.push(new window.docx.Paragraph({ children: [new window.docx.TextRun({ text: node.textContent.trim() })] }));
                    }
                    return children;
                }
                tempDiv.childNodes.forEach(node => parseNode(node));
                return children;
            }

            // Create a new docx document with metadata
            const doc = new window.docx.Document({
                creator: "Girmin Book Editor",
                title: bookTitle || "Book"
            });

            // Add book title and chapters with formatted content
            let docChildren = [
                new window.docx.Paragraph({
                    text: bookTitle,
                    heading: window.docx.HeadingLevel.HEADING_1,
                    spacing: { after: 400 }
                })
            ];
            chapters.forEach(ch => {
                if (ch.title) {
                    docChildren.push(new window.docx.Paragraph({ text: ch.title, heading: window.docx.HeadingLevel.HEADING_2 }));
                }
                docChildren = docChildren.concat(htmlToDocxParagraphs(ch.content));
            });
            doc.addSection({ children: docChildren });

            window.docx.Packer.toBlob(doc).then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = (bookTitle || 'Book') + '.docx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                alert('Word file exported successfully!');
            }).catch(err => {
                alert('Word export failed: ' + err);
            });
        }

        function exportBookToPdf() {
            const { bookTitle, chapters } = getBookExportData();
            const bookContainer = document.getElementById('bookContainer');
            if (!bookContainer) return;
            const opt = {
                margin:       0.5,
                filename:     `${bookTitle}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(bookContainer).set(opt).save();
        }

    </script>
</body>
