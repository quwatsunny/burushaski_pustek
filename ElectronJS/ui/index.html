<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burushaski Dictionary Builder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="editor.html" style="position: absolute; top: 18px; left: 24px; z-index: 1000; text-decoration: none; color: #0071e3; font-weight: 600; font-size: 16px;">← Back to Editor</a>
    <a href="manage-dictionaries.html" style="position: absolute; top: 18px; right: 24px; z-index: 1000; text-decoration: none; color: #0071e3; font-weight: 600; font-size: 16px;">Manage Dictionaries</a>
    <div class="main-container">
            <!-- Bottom Bar -->
            <div class="bottom-bar" style="position: fixed; left: 0; right: 0; bottom: 0; height: 38px; background: #f8f8f8; border-top: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: flex-end; z-index: 1001;">
                <div style="margin-right: 32px; margin-left: auto; display: flex; align-items: center;">
                    <img src="assets/logo.svg" alt="Girmin Logo" style="height: 28px; width: 28px; border-radius: 6px;">
                </div>
            </div>
        <div class="card">
            <div class="card-header">
                <h1>Girmin</h1>
                <p>Spelling Dictionary for Text Editor</p>
            </div>
            <div class="card-body">
                <!-- Alert Container -->
                <div class="alert-container" id="alertContainer"></div>

                <!-- File Upload Section -->
                <div class="form-group">
                    <label class="form-label">Import Dictionary</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv,.lift,.xml">
                        <label for="fileInput" class="file-input-label">
                            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span class="upload-text">Drop files here or <span class="upload-link">choose</span></span>
                            <span class="upload-hint">CSV or LIFT format</span>
                        </label>
                        <div id="fileName" class="file-name"></div>
                    </div>
                </div>

                <!-- Dialect Selection -->
                <!-- Dialect Selection Removed -->

                <!-- Language Details -->
                <div class="form-group" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
                    <div style="flex: 1; min-width: 140px;">
                        <label for="languageName" class="form-label">Language Name</label>
                        <input type="text" id="languageName" class="form-input" placeholder="e.g. Burushaski">
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label for="bcpCode" class="form-label">BCP 47 Code</label>
                        <input type="text" id="bcpCode" class="form-input" placeholder="e.g. bsk">
                    </div>
                    <div style="flex: 1; min-width: 100px;">
                        <label for="script" class="form-label">Script</label>
                        <input type="text" id="script" class="form-input" placeholder="e.g. Arab">
                    </div>
                    <div style="flex: 1; min-width: 80px;">
                        <label for="region" class="form-label">Region</label>
                        <input type="text" id="region" class="form-input" placeholder="e.g. PK">
                    </div>
                </div>

                <!-- Action Button -->
                <div class="form-group">
                    <button id="buildBtn" class="btn-primary" onclick="build()">Import & Merge Dictionary</button>
                </div>

                <!-- Info Text -->
                <div class="info-text">
                    <strong>How it works:</strong> New entries will be merged with the existing dictionary. Duplicate entries are automatically skipped.
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="overlay" class="d-none">
        <div class="overlay-content">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script src="assets/js/dic_builder.js"></script>
</body>
</html>
