<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5a2b"/>
      <stop offset="30%" style="stop-color:#d4a574"/>
      <stop offset="60%" style="stop-color:#c4956a"/>
      <stop offset="100%" style="stop-color:#6b4423"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5e6d3"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8d4be"/>
    </linearGradient>
    <linearGradient id="inkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c1929"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle background -->
  <circle cx="100" cy="100" r="95" fill="#faf8f5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Feather quill -->
  <g transform="translate(100, 95) rotate(-30)">
    <!-- Feather shaft/rachis -->
    <path d="M0 -70 Q2 0 0 75" stroke="url(#featherGrad)" stroke-width="3" fill="none"/>
    
    <!-- Left barbs -->
    <path d="M0 -65 Q-35 -55 -45 -40" stroke="none" fill="url(#quillGrad)" opacity="0.9"/>
    <path d="M0 -65 C-15 -60 -40 -50 -48 -35 Q-35 -45 0 -50 Z" fill="url(#quillGrad)"/>
    <path d="M0 -50 C-18 -45 -45 -30 -52 -10 Q-38 -25 0 -35 Z" fill="url(#quillGrad)"/>
    <path d="M0 -35 C-20 -28 -48 -10 -50 15 Q-35 -5 0 -18 Z" fill="url(#quillGrad)"/>
    <path d="M0 -18 C-18 -10 -42 10 -40 35 Q-30 12 0 0 Z" fill="url(#quillGrad)"/>
    
    <!-- Right barbs -->
    <path d="M0 -65 C15 -60 40 -50 48 -35 Q35 -45 0 -50 Z" fill="url(#quillGrad)"/>
    <path d="M0 -50 C18 -45 45 -30 52 -10 Q38 -25 0 -35 Z" fill="url(#quillGrad)"/>
    <path d="M0 -35 C20 -28 48 -10 50 15 Q35 -5 0 -18 Z" fill="url(#quillGrad)"/>
    <path d="M0 -18 C18 -10 42 10 40 35 Q30 12 0 0 Z" fill="url(#quillGrad)"/>
    
    <!-- Feather detail lines -->
    <path d="M0 -60 L-30 -45" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    <path d="M0 -45 L-35 -25" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    <path d="M0 -30 L-38 -5" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    <path d="M0 -60 L30 -45" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    <path d="M0 -45 L35 -25" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    <path d="M0 -30 L38 -5" stroke="#c4a882" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Quill nib (cut tip) -->
    <path d="M-2 65 L0 85 L2 65 Q1 70 0 72 Q-1 70 -2 65 Z" fill="url(#featherGrad)"/>
    <path d="M0 72 L0 85" stroke="#3d2914" stroke-width="1"/>
  </g>
  
  <!-- Ink drop -->
  <ellipse cx="145" cy="155" rx="8" ry="4" fill="url(#inkBlue)" opacity="0.7"/>
  <circle cx="148" cy="152" r="3" fill="url(#inkBlue)"/>
  
  <!-- Text -->
  <text x="100" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" 
        fill="#3d2914" text-anchor="middle" letter-spacing="4">GIRMIN</text>
</svg>