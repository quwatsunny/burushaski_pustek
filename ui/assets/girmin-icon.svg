<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5a2b"/>
      <stop offset="50%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#6b4423"/>
    </linearGradient>
    <linearGradient id="fWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5e6d3"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8d4be"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#faf8f5"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Feather quill -->
  <g transform="translate(32, 32) rotate(-35)">
    <!-- Shaft -->
    <path d="M0 -24 Q1 0 0 28" stroke="url(#fGrad)" stroke-width="2" fill="none"/>
    
    <!-- Left barbs -->
    <path d="M0 -22 C-8 -18 -18 -10 -20 2 Q-12 -8 0 -12 Z" fill="url(#fWhite)"/>
    <path d="M0 -12 C-10 -6 -18 5 -16 18 Q-10 5 0 0 Z" fill="url(#fWhite)"/>
    
    <!-- Right barbs -->
    <path d="M0 -22 C8 -18 18 -10 20 2 Q12 -8 0 -12 Z" fill="url(#fWhite)"/>
    <path d="M0 -12 C10 -6 18 5 16 18 Q10 5 0 0 Z" fill="url(#fWhite)"/>
    
    <!-- Nib -->
    <path d="M-1.5 24 L0 32 L1.5 24 Z" fill="url(#fGrad)"/>
  </g>
  
  <!-- Ink dot -->
  <circle cx="50" cy="50" r="4" fill="#1e3a5f" opacity="0.8"/>
</svg>